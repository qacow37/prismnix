[project]
name = "prismgen"
version = "1.0.0"
description = "Tool for maintaining a Modrinth database for prismnix"
license = "MIT"
dependencies = [
    "requests>=2.0.0",
    "requests-ratelimiter>=0.10.0",
    "packaging>=26.0",
    "typer>=0.25.0",
    "jinja2>=3.0.0"
]
requires-python = ">=3.0"

[project.scripts]
prismgen = "prismgen:app"

[project.urls]
HomePage = "https://github.com/qacow37/prismnix"
